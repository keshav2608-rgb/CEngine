# Render Blueprint: deploys the CEngine API (Express + Socket.IO).
# Render dashboard -> New -> Blueprint -> pick this repo. Fill in the `sync: false` values when prompted.
services:
  - type: web
    name: cengine-api
    runtime: node
    plan: free
    region: singapore # keep next to the Neon database (ap-southeast-1)
    rootDir: server
    # devDependencies (typescript, prisma) are needed to build, so include them explicitly
    buildCommand: npm ci --include=dev && npm run build && npx prisma db push --skip-generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: CLIENT_URL
        sync: false # e.g. https://cengine.vercel.app (no trailing slash)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false # https://<accountid>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false # https://pub-<hash>.r2.dev
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
